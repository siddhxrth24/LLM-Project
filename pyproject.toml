[project]
name = "semestrack"
version = "0.1.0"
description = "SemesTrack offline AI learning platform backend"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<0.120",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5,<1.0",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.11",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.uv]
find-links = ["https://download.pytorch.org/whl/cpu"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
